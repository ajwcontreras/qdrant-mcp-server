<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cfcode (qdrant-mcp-server) — Architecture</title><style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:dark;--bg:#0d1117;--sec:#161b22;--ink:#c9d1d9;--line:#30363d;--accent:#58a6ff}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:22px 28px 14px;background:rgba(13,17,23,.92);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
h1{font-size:22px;font-weight:720}
main{display:grid;gap:22px;padding:18px 28px 28px}
section{background:var(--sec);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
h2{padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px;font-weight:680;position:sticky;left:0}
.svg-container{overflow:auto;max-height:80vh;max-width:100vw}
img{display:block;max-width:none;padding:16px}
</style></head><body>
<header><h1>cfcode (qdrant-mcp-server) — Architecture Diagrams</h1></header><main>
<section><h2>Data Models</h2><div class="svg-container"><img src="data_models.svg" alt="Data models"></div></section>
<section><h2>Data Flows</h2><div class="svg-container"><img src="data_flows.svg" alt="Data flows"></div></section>
<section><h2>Data Pipelines</h2><div class="svg-container"><img src="data_pipelines.svg" alt="Data pipelines"></div></section>
</main></body></html>
